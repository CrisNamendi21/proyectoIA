services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: colegio-alfa-backend:dev
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      alfa-db:
        condition: service_healthy

  alfa-db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - alfa-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  alfa-db-data:
